name: Validate
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tests/run_host_tests.py
      - run: pip install esphome==2026.10.2
      - run: python tests/test_selection.py
      - name: ESPHome configuration and code generation
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: validation-network
          wifi_password: validation-password
          web_username: validation-user
          web_password: validation-web-password
          EOF
          python -c "from pathlib import Path; p=Path('lwz303-sol-example.yaml'); Path('.lwz303-ci.yaml').write_text(p.read_text(encoding='utf-8').replace('source: github://vandecook/lwz303-to-esp32', 'source: components', 1), encoding='utf-8')"
          esphome config .lwz303-ci.yaml
          esphome compile .lwz303-ci.yaml --only-generate
