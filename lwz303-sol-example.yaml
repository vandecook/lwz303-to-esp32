substitutions:
  device_name: lwz303-sol
  friendly_name: "LWZ 303 SOL"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: vandecook.lwz303-to-esp32
    version: "0.3.0"
  min_version: 2026.10.2
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(lwz303).set_firmware(id(lwz_firmware).current_option());
          id(lwz303).set_hc1_layout(id(hc1_decoder_layout).current_option());
          id(lwz303).set_status_interval(uint32_t(id(normal_interval).state * 1000));
          id(lwz303).set_dynamic_interval(uint32_t(id(dynamic_interval).state * 1000));
          id(lwz303).set_config_interval(uint32_t(id(config_interval).state * 60000));
          id(lwz303).set_dynamic_enabled(id(dynamic_enabled).state);
          id(lwz303).set_trigger_compressor(id(trigger_compressor).state);
          id(lwz303).set_trigger_heating(id(trigger_heating).state);
          id(lwz303).set_trigger_dhw(id(trigger_dhw).state);

# Tested setup: ESP32-C3, RX5/TX6. Adjust board for the precise C3 module.
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 0
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
preferences:
  flash_write_interval: 1min

web_server:
  sorting_groups:
    - id: lwz_basic
      name: "Basis"
      sorting_weight: 10
    - id: lwz_expert
      name: "Expert (in HA aktivierbar)"
      sorting_weight: 20
  port: 80
  version: 3
  local: true
  log: true
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

external_components:
  - source: components
    components: [lwz2]

# 9600 8N1 through an RS232 <-> 3.3 V TTL transceiver (e.g. MAX3232).
uart:
  id: lwz_uart
  rx_pin: GPIO5
  tx_pin: GPIO6
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

lwz2:
  id: lwz303
  uart_id: lwz_uart
  # These are decoder profiles, not the physical device firmware (2.16).
  firmware: "2.14j"
  hc1_layout: "2.06"
