select:
  - platform: template
    id: hc1_decoder_layout
    name: "LWZ HK1 Decoderlayout"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "2.06"
    options: ["2.06", "2.14", "2.14j"]
    on_value:
      - lambda: id(lwz303).set_hc1_layout(x);

  - platform: template
    name: "LWZ Firmwareprofil"
    id: lwz_firmware
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "2.14j"
    options: ["2.06", "2.14", "2.14j"]
    on_value:
      - lambda: id(lwz303).set_firmware(x);

number:
  - platform: template
    id: normal_interval
    name: "sGlobal Normalintervall"
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - lambda: id(lwz303).set_status_interval(uint32_t(x * 1000));
  - platform: template
    id: dynamic_interval
    name: "sGlobal Dynamikintervall"
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - lambda: id(lwz303).set_dynamic_interval(uint32_t(x * 1000));
  - platform: template
    id: config_interval
    name: "HK1 Konfigurationsintervall"
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 1440
    step: 1
    initial_value: 60
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - lambda: id(lwz303).set_config_interval(uint32_t(x * 60000));

switch:
  - platform: template
    id: lwz_write_permission
    name: "LWZ Schreibfreigabe"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(lwz303).set_writes_enabled(true);
    turn_off_action:
      - lambda: id(lwz303).set_writes_enabled(false);

  - platform: template
    id: dynamic_enabled
    name: "Dynamische Abfrage"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_dynamic_enabled(true);
    turn_off_action:
      - lambda: id(lwz303).set_dynamic_enabled(false);
  - platform: template
    id: trigger_compressor
    name: "Dynamik bei Kompressor"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_trigger_compressor(true);
    turn_off_action:
      - lambda: id(lwz303).set_trigger_compressor(false);
  - platform: template
    id: trigger_heating
    name: "Dynamik bei Heizbetrieb"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_trigger_heating(true);
    turn_off_action:
      - lambda: id(lwz303).set_trigger_heating(false);
  - platform: template
    id: trigger_dhw
    name: "Dynamik bei Warmwasser"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_trigger_dhw(true);
    turn_off_action:
      - lambda: id(lwz303).set_trigger_dhw(false);

  - platform: template
    id: restart_confirm
    name: "ESP32 Neustart bestÃ¤tigen (30s)"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: restart_window
    turn_off_action:
      - script.stop: restart_window

script:
  - id: restart_window
    mode: restart
    then:
      - delay: 30s
      - switch.turn_off: restart_confirm

button:
  - platform: template
    name: "LWZ Sommerzeit (+1 Stunde)"
    entity_category: config
    on_press:
      - lambda: id(lwz303).request_clock_shift(1);
  - platform: template
    name: "LWZ Winterzeit (-1 Stunde)"
    entity_category: config
    on_press:
      - lambda: id(lwz303).request_clock_shift(-1);

  - platform: template
    name: "HK1 jetzt aktualisieren"
    on_press:
      - lambda: id(lwz303).refresh_config();
  - platform: template
    name: "KommunikationszÃ¤hler zurÃ¼cksetzen"
    entity_category: diagnostic
    on_press:
      - lambda: id(lwz303).reset_counters();
  - platform: template
    name: "RS232 neu initialisieren"
    entity_category: diagnostic
    on_press:
      - lambda: id(lwz303).reinitialize();
  - platform: template
    name: "ESP32 neu starten"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            switch.is_on: restart_confirm
          then:
            - switch.turn_off: restart_confirm
            - lambda: App.safe_reboot();
          else:
            - logger.log: "Neustart zuerst mit dem BestÃ¤tigungsschalter freigeben"

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 10s
  - platform: template
    name: "Aktuelles sGlobal Intervall"
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(lwz303).effective_interval() / 1000.0f;

time:
  - platform: sntp
    id: local_time
    timezone: Europe/Vienna

text_sensor:
  - platform: template
    name: "ESP32 Uhrzeit"
    update_interval: 10s
    lambda: |-
      auto now = id(local_time).now();
      if (!now.is_valid()) return {"nicht verfÃ¼gbar"};
      return now.strftime("%Y-%m-%d %H:%M:%S %Z");
