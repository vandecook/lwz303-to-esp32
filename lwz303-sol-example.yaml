substitutions:
  device_name: lwz303-sol
  friendly_name: "LWZ 303 SOL"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: vandecook.lwz303-to-esp32
    version: "0.2.0"
  min_version: 2026.10.2
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(lwz303).set_firmware(id(lwz_firmware).current_option());
          id(lwz303).set_status_interval(uint32_t(id(normal_interval).state * 1000));
          id(lwz303).set_dynamic_interval(uint32_t(id(dynamic_interval).state * 1000));
          id(lwz303).set_config_interval(uint32_t(id(config_interval).state * 60000));
          id(lwz303).set_dynamic_enabled(id(dynamic_enabled).state);
          id(lwz303).set_trigger_compressor(id(trigger_compressor).state);
          id(lwz303).set_trigger_heating(id(trigger_heating).state);
          id(lwz303).set_trigger_dhw(id(trigger_dhw).state);

# Tested setup: ESP32-C3, RX5/TX6. Adjust board for the precise C3 module.
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 0
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
preferences:
  flash_write_interval: 1min

web_server:
  port: 80
  version: 3
  local: true
  log: true
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

external_components:
  - source: components
    components: [lwz2]

# 9600 8N1 through an RS232 <-> 3.3 V TTL transceiver (e.g. MAX3232).
uart:
  id: lwz_uart
  rx_pin: GPIO5
  tx_pin: GPIO6
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

lwz2:
  id: lwz303
  uart_id: lwz_uart
  firmware: "2.14j"
  status_interval: 10s
  stale_after: 30s
  outside_temperature:
    name: "Außentemperatur"
  flow_temperature:
    name: "Vorlauf"
  return_temperature:
    name: "Rücklauf"
  dhw_temperature:
    name: "Warmwasser"
  compressor:
    name: "Kompressor"
  heating_active:
    name: "Heizbetrieb (HK-Pumpe)"
  dhw_active:
    name: "Warmwasserbereitung (WW-Pumpe)"
  hc1_gradient:
    name: "HK1 Gradient (P13)"
  hc1_low_end:
    name: "HK1 Fußpunkt (P14)"
  communication_ok:
    name: "Kommunikation OK"
  communication_status:
    name: "Kommunikationszustand"
  last_error:
    name: "Letzter Kommunikationsfehler"
  successful_queries:
    name: "Erfolgreiche Abfragen"
  failed_queries:
    name: "Fehlgeschlagene Abfragen"
  timeouts:
    name: "Timeouts"
  retries:
    name: "Retries"
  last_success:
    name: "Letzter Erfolg seit Boot"
  config_updated:
    name: "HK1 aktualisiert seit Boot"
  firmware_version:
    name: "Abgefragte Firmware"

select:
  - platform: template
    name: "LWZ Firmwareprofil"
    id: lwz_firmware
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "2.14j"
    options: ["2.06", "2.14", "2.14j"]
    on_value:
      - lambda: id(lwz303).set_firmware(x);

number:
  - platform: template
    id: normal_interval
    name: "sGlobal Normalintervall"
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - lambda: id(lwz303).set_status_interval(uint32_t(x * 1000));
  - platform: template
    id: dynamic_interval
    name: "sGlobal Dynamikintervall"
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - lambda: id(lwz303).set_dynamic_interval(uint32_t(x * 1000));
  - platform: template
    id: config_interval
    name: "HK1 Konfigurationsintervall"
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 1440
    step: 1
    initial_value: 60
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - lambda: id(lwz303).set_config_interval(uint32_t(x * 60000));

switch:
  - platform: template
    id: dynamic_enabled
    name: "Dynamische Abfrage"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_dynamic_enabled(true);
    turn_off_action:
      - lambda: id(lwz303).set_dynamic_enabled(false);
  - platform: template
    id: trigger_compressor
    name: "Dynamik bei Kompressor"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_trigger_compressor(true);
    turn_off_action:
      - lambda: id(lwz303).set_trigger_compressor(false);
  - platform: template
    id: trigger_heating
    name: "Dynamik bei Heizbetrieb"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_trigger_heating(true);
    turn_off_action:
      - lambda: id(lwz303).set_trigger_heating(false);
  - platform: template
    id: trigger_dhw
    name: "Dynamik bei Warmwasser"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_trigger_dhw(true);
    turn_off_action:
      - lambda: id(lwz303).set_trigger_dhw(false);

  - platform: template
    id: restart_confirm
    name: "ESP32 Neustart bestätigen (30s)"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - delay: 30s
      - switch.turn_off: restart_confirm

button:
  - platform: template
    name: "HK1 jetzt aktualisieren"
    on_press:
      - lambda: id(lwz303).refresh_config();
  - platform: template
    name: "Kommunikationszähler zurücksetzen"
    entity_category: diagnostic
    on_press:
      - lambda: id(lwz303).reset_counters();
  - platform: template
    name: "RS232 neu initialisieren"
    entity_category: diagnostic
    on_press:
      - lambda: id(lwz303).reinitialize();
  - platform: template
    name: "ESP32 neu starten"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            switch.is_on: restart_confirm
          then:
            - switch.turn_off: restart_confirm
            - lambda: App.safe_reboot();
          else:
            - logger.log: "Neustart zuerst mit dem Bestätigungsschalter freigeben"

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 10s
  - platform: template
    name: "Aktuelles sGlobal Intervall"
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(lwz303).effective_interval() / 1000.0f;

time:
  - platform: sntp
    id: local_time
    timezone: Europe/Vienna

text_sensor:
  - platform: template
    name: "ESP32 Uhrzeit"
    update_interval: 10s
    lambda: |-
      auto now = id(local_time).now();
      if (!now.is_valid()) return {"nicht verfügbar"};
      return now.strftime("%Y-%m-%d %H:%M:%S %Z");
