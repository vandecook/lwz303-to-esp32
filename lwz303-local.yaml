    name: "Geraetemodell"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Unbekannt"
    options: ["Unbekannt", "LWZ 303 i / Integral", "LWZ 303 / 403 SOL"]
    on_value:
      - lambda: |-
          id(lwz303).set_device_model(x == "LWZ 303 i / Integral" ? "i" : x == "LWZ 303 / 403 SOL" ? "SOL" : "unknown");
  - platform: template
    id: lwz_speed_source
    name: "Luefterdiagnose Drehzahlquelle"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "sGlobal"
    options: ["sGlobal", "sFan"]
    on_value:
      - lambda: id(lwz303).set_fan_speed_source(x);
  - platform: template
    id: hc1_decoder_layout
    name: "HK1 Decoderlayout"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "2.06"
    options: ["2.06", "2.14", "2.14j"]
    on_value:
      - lambda: id(lwz303).set_hc1_layout(x);

  - platform: template
    name: "Firmwareprofil"
    id: lwz_firmware
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "2.14j"
    options: ["2.06", "2.14", "2.14j", "2.16"]
    on_value:
      - lambda: id(lwz303).set_firmware(x);

number:
  - platform: template
    id: normal_interval
    name: "Statusabfrage Standardintervall"
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - lambda: id(lwz303).set_status_interval(uint32_t(x * 1000));
  - platform: template
    id: dynamic_interval
    name: "Statusabfrage Schnellintervall"
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - lambda: id(lwz303).set_dynamic_interval(uint32_t(x * 1000));
  - platform: template
    id: config_interval
    name: "Heizkurven-Abfrageintervall HK1"
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 1440
    step: 1
    initial_value: 1
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - lambda: id(lwz303).set_config_interval(uint32_t(x * 60000));

switch:
  - platform: template
    id: lwz_write_permission
    name: "Schreibfreigabe"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(lwz303).set_writes_enabled(true);
    turn_off_action:
      - lambda: id(lwz303).set_writes_enabled(false);

  - platform: template
    id: dynamic_enabled
    name: "Beschleunigte Statusabfrage"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_dynamic_enabled(true);
    turn_off_action:
      - lambda: id(lwz303).set_dynamic_enabled(false);
  - platform: template
    id: trigger_compressor
    name: "Schnellabfrage bei Verdichterbetrieb"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_trigger_compressor(true);
    turn_off_action:
      - lambda: id(lwz303).set_trigger_compressor(false);
  - platform: template
    id: trigger_heating
    name: "Schnellabfrage bei Heizbetrieb"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_trigger_heating(true);
    turn_off_action:
      - lambda: id(lwz303).set_trigger_heating(false);
  - platform: template
    id: trigger_dhw
    name: "Schnellabfrage bei Warmwasserbereitung"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(lwz303).set_trigger_dhw(true);
    turn_off_action:
      - lambda: id(lwz303).set_trigger_dhw(false);

  - platform: template
    id: restart_confirm
    name: "ESP32 Neustart bestätigen (30s)"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: restart_window
    turn_off_action:
      - script.stop: restart_window

script:
  - id: restart_window
    mode: restart
    then:
      - delay: 30s
      - switch.turn_off: restart_confirm

button:
  - platform: template
    id: lwz_profile_save
    name: "Profil Entwurf speichern"
    entity_category: config
    web_server:
      sorting_group_id: lwz_profiles
    on_press:
      - lambda: id(lwz303).save_profile();
  - platform: template
    id: lwz_profile_discard
    name: "Profil Entwurf verwerfen"
    entity_category: config
    web_server:
      sorting_group_id: lwz_profiles
    on_press:
      - lambda: id(lwz303).discard_profile_draft();
  - platform: template
    id: lwz_profile_copy
    name: "Profil Anlagenwerte in Entwurf"
    entity_category: config
    web_server:
      sorting_group_id: lwz_profiles
    on_press:
      - lambda: id(lwz303).copy_actual_to_profile();
  - platform: template
    id: lwz_profile_apply
    name: "Profil jetzt anwenden"
    entity_category: config
    web_server:
      sorting_group_id: lwz_profiles
    on_press:
      - lambda: id(lwz303).apply_profile();
  - platform: template
    id: lwz_profile_refresh
    name: "Profil Anlagenwerte jetzt lesen"
    entity_category: config
    web_server:
      sorting_group_id: lwz_profiles
    on_press:
      - lambda: id(lwz303).refresh_config();
  - platform: template
    id: lwz_query_firmware
    name: "Firmware jetzt abfragen"
    entity_category: diagnostic
    on_press:
      - lambda: id(lwz303).refresh_firmware();
  - platform: template
    id: lwz_reset_fan_faults
    name: "Luefterfehler nach LWZ-Neustart zuruecksetzen"
    entity_category: diagnostic
    on_press:
      - lambda: id(lwz303).reset_fan_faults();
  - platform: template
    name: "Unklare Uhrzeit als Winterzeit bestaetigen"
    entity_category: config
    on_press:
      - lambda: id(lwz303).confirm_clock_mode(false);
  - platform: template
    name: "Unklare Uhrzeit als Sommerzeit bestaetigen"
    entity_category: config
    on_press:
      - lambda: id(lwz303).confirm_clock_mode(true);
  - platform: template
    name: "Uhr Stunde +1 korrigieren"
    entity_category: config
    on_press:
      - lambda: id(lwz303).request_clock_shift(1);
  - platform: template
    name: "Uhr Stunde -1 korrigieren"
    entity_category: config
    on_press:
      - lambda: id(lwz303).request_clock_shift(-1);

  - platform: template
    name: "HK1 jetzt aktualisieren"
    on_press:
      - lambda: id(lwz303).refresh_config();
  - platform: template
    name: "Kommunikationszähler zurücksetzen"
    entity_category: diagnostic
    on_press:
      - lambda: id(lwz303).reset_counters();
  - platform: template
    name: "RS232 neu initialisieren"
    entity_category: diagnostic
    on_press:
      - lambda: id(lwz303).reinitialize();
  - platform: template
    name: "ESP32 neu starten"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            switch.is_on: restart_confirm
          then:
            - switch.turn_off: restart_confirm
            - lambda: App.safe_reboot();
          else:
            - logger.log: "Neustart zuerst mit dem BestÃ¤tigungsschalter freigeben"

sensor:
  - platform: uptime
    id: lwz_uptime_seconds
    name: "Uptime"
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: lwz_expert
    update_interval: 10s
  - platform: template
    name: "Aktives Status-Abfrageintervall"
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(lwz303).effective_interval() / 1000.0f;

time:
  - platform: sntp
    id: local_time
    timezone: Europe/Vienna

text_sensor:
  - platform: template
    name: "ESP32 Laufzeit"
    id: lwz_uptime_readable
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      const float value = id(lwz_uptime_seconds).state;
      if (!std::isfinite(value) || value < 0) return {"noch nicht verfuegbar"};
      const uint64_t seconds = static_cast<uint64_t>(value);
      char text[48];
      snprintf(text, sizeof(text), "%llu d %02u:%02u:%02u",
               static_cast<unsigned long long>(seconds / 86400),
               static_cast<unsigned>((seconds / 3600) % 24),
               static_cast<unsigned>((seconds / 60) % 60),
               static_cast<unsigned>(seconds % 60));
      return {text};
  - platform: template
    name: "ESP32 Uhrzeit"
    update_interval: 10s
    lambda: |-
      auto now = id(local_time).now();
      if (!now.is_valid()) return {"nicht verfÃ¼gbar"};
      return now.strftime("%Y-%m-%d %H:%M:%S %Z");
