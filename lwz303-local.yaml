# Board: ESP32-C3 Super Mini (Generic)
# Definition: definitions/boards/esp32-c3-supermini/manifest.yaml


substitutions:
  device_name: lwz303
  friendly_name: "LWZ 303"

esphome:
  name: ${device_name}
  friendly_name: ${device_name}
  project:
    name: vandecook.lwz303-to-esp32
    version: "0.6.2"
  min_version: 2026.10.2
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(lwz303).set_device_model(id(lwz_device_model).current_option() == "LWZ 303 i / Integral" ? "i" : id(lwz_device_model).current_option() == "LWZ 303 / 403 SOL" ? "SOL" : "unknown");
          id(lwz303).set_fan_speed_source(id(lwz_speed_source).current_option());
          id(lwz303).set_firmware(id(lwz_firmware).current_option());
          id(lwz303).set_hc1_layout(id(hc1_decoder_layout).current_option());
          id(lwz303).set_status_interval(uint32_t(id(normal_interval).state * 1000));
          id(lwz303).set_dynamic_interval(uint32_t(id(dynamic_interval).state * 1000));
          id(lwz303).set_config_interval(uint32_t(id(config_interval).state * 60000));
          id(lwz303).set_dynamic_enabled(id(dynamic_enabled).state);
          id(lwz303).set_trigger_compressor(id(trigger_compressor).state);
          id(lwz303).set_trigger_heating(id(trigger_heating).state);
          id(lwz303).set_trigger_dhw(id(trigger_dhw).state);
esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
      
web_server:
  sorting_groups:
    - id: lwz_basic
      name: "Basis"
      sorting_weight: 10
    - id: lwz_profiles
      name: "Heizkurvenprofile"
      sorting_weight: 15
    - id: lwz_expert
      name: "Expert (in HA aktivierbar)"
      sorting_weight: 20
  port: 80
  version: 3
  local: false
  log: true
#  auth:
#    type: digest
#    username: !secret web_username
#    password: !secret web_password

logger:
  #level: VERY_VERBOSE
  hardware_uart: USB_CDC
  baud_rate: 0
  level: DEBUG # VERY_VERBOSE #INFO

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key


ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid_IoT
  password: !secret wifi_password_IoT

  domain: .roliko.lan
  #use_address: 192.168.100.132
  #networks:
  #  - id: !extend wifi_default
  manual_ip:
    static_ip: 192.168.100.94
    gateway: 192.168.100.1
    subnet: 255.255.255.0
    dns1: 192.168.100.1
    #dns2: 8.8.8.8

  ap:
    ssid: "LWZ303 Fallback"
    password: !secret ap_password

preferences:
  flash_write_interval: 1min

captive_portal:


external_components:
  - source: components
    refresh: 0s
    components: [lwz2]

uart:
  id: lwz_uart
  tx_pin: GPIO6
  rx_pin: GPIO5
  baud_rate: 9600 #14400 #14400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024


